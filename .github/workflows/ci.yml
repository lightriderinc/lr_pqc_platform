name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails if the scanner program was replaced without updating its checksum.
      - run: sha256sum -c qsearch-service/qsearch.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
